<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Con v1 — Split Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:#111;}
:root{--green:#2D6B16;--green-dark:#1A4209;--green-mid:#3A8520;--lime:#7ECB5A;}

.ac{display:grid;grid-template-columns:1fr 1fr;min-height:520px;}
.ac-left{background:var(--green-dark);padding:64px 56px;display:flex;flex-direction:column;justify-content:center;}
.ac-right{position:relative;overflow:hidden;}
.ac-right img{width:100%;height:100%;object-fit:cover;display:block;}
.ac-right::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,var(--green-dark) 0%,transparent 40%);}

.eyebrow{font-size:0.7rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--lime);margin-bottom:14px;}
.heading{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,6vw,5.5rem);color:#fff;line-height:0.9;letter-spacing:0.02em;margin-bottom:6px;}
.heading span{color:var(--lime);}
.sub{font-size:0.72rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:28px;border-left:3px solid var(--lime);padding-left:10px;}

.benefits{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.benefit{display:flex;align-items:center;gap:10px;font-size:0.82rem;font-weight:600;color:rgba(255,255,255,0.8);}
.tick{width:18px;height:18px;background:var(--lime);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.prices{display:flex;gap:12px;margin-bottom:32px;}
.price-card{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:16px 18px;}
.price-label{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:4px;}
.price-num{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--lime);line-height:1;}
.price-note{font-size:0.65rem;color:rgba(255,255,255,0.3);margin-top:2px;}

.btn{display:inline-block;background:var(--lime);color:var(--green-dark);padding:14px 36px;border-radius:6px;font-size:0.85rem;font-weight:700;text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;transition:background 0.15s,transform 0.15s;}
.btn:hover{background:#93d872;transform:translateY(-2px);}

.tag{position:absolute;bottom:28px;right:28px;z-index:2;background:var(--green-dark);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.06em;padding:14px 20px;border-radius:8px;text-align:center;border-left:4px solid var(--lime);}
</style>
</head>
<body>
<div class="ac">
  <div class="ac-left">
    <div class="eyebrow">Lucky Motors Peterborough</div>
    <div class="heading">AIR CON<br><span>RE-GAS</span></div>
    <div class="sub">All Makes &amp; Models</div>
    <div class="benefits">
      <div class="benefit"><div class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="#1A4209"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>Ice Cold Air</div>
      <div class="benefit"><div class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="#1A4209"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>Better Fuel Efficiency</div>
      <div class="benefit"><div class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="#1A4209"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>Faster Window Demisting</div>
      <div class="benefit"><div class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="#1A4209"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>Air Con Health Check Included</div>
    </div>
    <div class="prices">
      <div class="price-card">
        <div class="price-label">R134a Re-Gas</div>
        <div class="price-num">£50</div>
        <div class="price-note">Incl. VAT</div>
      </div>
      <div class="price-card">
        <div class="price-label">R1234yf Re-Gas</div>
        <div class="price-num">£90</div>
        <div class="price-note">Incl. VAT</div>
      </div>
    </div>
    <a href="tel:01733977754" class="btn">Book Now — 01733 977754</a>
  </div>
  <div class="ac-right">
    <img src="ejcuts/air con add.PNG" alt="Air con service">
    <div class="tag">KEEP YOUR AIR CON<br>WORKING AT ITS BEST</div>
  </div>
</div>
</body>
</html>
